<!doctype html>
<html lang="en" data-theme="dark" data-accent="butter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Godzilla Health Monitor</title>
    <meta name="color-scheme" content="dark light" />
    <!-- Apply the saved theme before first paint so dark mode never flashes light. -->
    <script>
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('sam.theme') === 'light' ? 'light' : 'dark');
      } catch (e) {}
    </script>
    <style>html, body { background: #000; } html[data-theme='light'], html[data-theme='light'] body { background: #cdd2da; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
